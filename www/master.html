<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ﾏｽﾀ管理 | 吉岡商会</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#f0f4f8;color:#333;font-size:14px}
header{background:#1a3a5c;color:white;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
header h1{font-size:15px;white-space:nowrap}
header a{color:#aad4f5;text-decoration:none;font-size:11px;white-space:nowrap}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e0e7ef;padding:0 8px}
.tab{padding:8px 10px;cursor:pointer;font-weight:bold;color:#666;border-bottom:3px solid transparent;margin-bottom:-2px;font-size:12px;white-space:nowrap}
.tab.active{color:#1a3a5c;border-bottom-color:#1a3a5c}
.content{display:none;padding:20px}
.content.active{display:block}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input{padding:7px 12px;border:1px solid #ccc;border-radius:6px;font-size:13px;width:220px}
.btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold}
.btn-primary{background:#1a3a5c;color:white}
.btn-success{background:#4CAF50;color:white}
.btn-danger{background:#f44336;color:white;padding:3px 7px;font-size:11px}
.btn-edit{background:#FF9800;color:white;padding:3px 7px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* 編集ロック */
.lock-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#FFF8E1;
  border-bottom:1px solid #FFE082;font-size:11px;color:#795548;flex-wrap:wrap}
.lock-bar.unlocked{background:#E8F5E9;border-bottom-color:#A5D6A7;color:#2E7D32}
.lock-bar .btn{padding:3px 9px;font-size:11px}
table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);table-layout:fixed}
th{background:#1a3a5c;color:white;padding:5px 4px;text-align:left;font-size:10px;line-height:1.25;word-break:keep-all}
td{padding:5px 4px;border-bottom:1px solid #f0f0f0;vertical-align:middle;font-size:11px;line-height:1.3;word-break:break-all}
.col-ops{width:74px}
.ops{display:flex;gap:3px;flex-wrap:nowrap}
.ops .btn{padding:2px 5px;font-size:10px;white-space:nowrap;flex:0 0 auto}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.badge-ok{background:#e8f5e9;color:#2e7d32}
.badge-ng{background:#fdecea;color:#c62828}
.count{color:#888;font-size:12px}
/* modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:white;border-radius:10px;padding:24px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,0.2)}
.modal h3{margin-bottom:16px;font-size:16px;color:#1a3a5c}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;color:#666;margin-bottom:4px}
.form-row input,.form-row select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.alert{padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:13px;display:none}
.alert.error{background:#fdecea;color:#c62828;display:block}
.alert.success{background:#e8f5e9;color:#2e7d32;display:block}
/* 部門切替 */
.dept-tabs{display:flex;background:#12293f}
.dept-tab{flex:1 1 0;text-align:center;padding:9px 6px;cursor:pointer;font-size:13px;font-weight:bold;
  color:rgba(255,255,255,0.55);border-bottom:3px solid transparent;transition:background .15s,color .15s}
.dept-tab:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85)}
.dept-tab.active{color:#fff;background:rgba(255,255,255,0.12);border-bottom-color:#4FC3F7}
#deptTab-sales.active{border-bottom-color:#FFB74D}
body.dept-sales header{background:#4a3410}
body.dept-sales .dept-tabs{background:#3a280c}
body.dept-sales th{background:#4a3410}
.dept-note{font-size:12px;color:#888;margin-bottom:10px}
</style>
</head>
<body>

<header>
  <h1>⚙️ ﾏｽﾀ管理</h1>
  <a href="/" id="backLink">← ﾀﾞｯｼｭﾎﾞｰﾄﾞへ戻る</a>
  <span id="deptLabel" style="margin-left:auto;font-size:13px;opacity:.85"></span>
</header>

<!-- 部門切替 -->
<div class="dept-tabs">
  <div class="dept-tab active" id="deptTab-rental" onclick="switchDept('rental')">🚙 ﾚﾝﾀｶｰ事業部</div>
  <div class="dept-tab" id="deptTab-sales" onclick="switchDept('sales')">🏢 ｾｰﾙｽ部門（代車）</div>
</div>

<!-- マスタ編集のロック状態 -->
<div class="lock-bar" id="lockBar">
  <span id="lockText">🔒 閲覧のみ（編集するには合言葉が必要です）</span>
  <button class="btn btn-primary" id="lockBtn" onclick="toggleLock()">編集する</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('vehicles')">🚗 車両ﾏｽﾀ</div>
  <div class="tab" onclick="showTab('clients')">🏢 取引先ﾏｽﾀ</div>
  <div class="tab" onclick="showTab('staff')">👤 従業員ﾏｽﾀ</div>
</div>

<!-- 車両マスタ -->
<div class="content active" id="tab-vehicles">
  <div class="toolbar">
    <input type="text" id="vSearch" placeholder="車番・車種で検索…" oninput="renderVehicles()">
    <button class="btn btn-success" onclick="openVehicleModal()">＋ 追加</button>
    <span class="count" id="vCount"></span>
  </div>
  <table>
    <thead><tr><th>車番</th><th>車種</th><th>地域</th><th>区分</th><th>冬ﾀｲﾔ</th><th>他社借り</th><th>操作</th></tr></thead>
    <tbody id="vTable"></tbody>
  </table>
</div>

<!-- 取引先マスタ -->
<div class="content" id="tab-clients">
  <div class="dept-note">※ 取引先ﾏｽﾀは両部門で共通です</div>
  <div class="toolbar">
    <input type="text" id="cSearch" placeholder="名前・読み仮名で検索…" oninput="renderClients()">
    <button class="btn btn-success" onclick="openClientModal()">＋ 追加</button>
    <span class="count" id="cCount"></span>
  </div>
  <table>
    <thead><tr><th>取引先名</th><th>読み仮名</th><th>操作</th></tr></thead>
    <tbody id="cTable"></tbody>
  </table>
</div>

<!-- 従業員マスタ -->
<div class="content" id="tab-staff">
  <div class="toolbar">
    <button class="btn btn-success" onclick="openStaffModal()">＋ 追加</button>
    <span class="count" id="sCount"></span>
  </div>
  <table>
    <thead><tr><th>氏名</th><th>操作</th></tr></thead>
    <tbody id="sTable"></tbody>
  </table>
</div>

<!-- 車両モーダル -->
<div class="overlay" id="vehicleModal">
  <div class="modal">
    <h3 id="vModalTitle">車両を追加</h3>
    <div class="alert" id="vAlert"></div>
    <div class="form-row"><label>部門</label>
      <select id="vDepartment">
        <option value="rental">レンタカー事業部</option>
        <option value="sales">セールス部門（代車）</option>
      </select>
    </div>
    <div class="form-row"><label>車番（4桁）</label><input type="text" id="vNumber" placeholder="例: 1234" maxlength="6"></div>
    <div class="form-row"><label>車種</label><input type="text" id="vCarType" placeholder="例: ADバン"></div>
    <div class="form-row"><label>地域</label><input type="text" id="vRegion" placeholder="例: 京都"></div>
    <div class="form-row"><label>区分</label><input type="text" id="vCarCategory" placeholder="例: 軽自動車"></div>
    <div class="form-row">
      <label><input type="checkbox" id="vStudless"> スタッドレスタイヤ装着</label>
    </div>
    <div class="form-row">
      <label><input type="checkbox" id="vRentalOther"> 他社借り車両</label>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('vehicleModal')" style="background:#eee">キャンセル</button>
      <button class="btn btn-primary" onclick="saveVehicle()">保存</button>
    </div>
  </div>
</div>

<!-- 取引先モーダル -->
<div class="overlay" id="clientModal">
  <div class="modal">
    <h3 id="cModalTitle">取引先を追加</h3>
    <div class="alert" id="cAlert"></div>
    <div class="form-row"><label>取引先名</label><input type="text" id="cName" placeholder="例: ネッツトヨタ滋賀"></div>
    <div class="form-row"><label>読み仮名（カタカナ）</label><input type="text" id="cReading" placeholder="例: ネッツトヨタシガ"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('clientModal')" style="background:#eee">キャンセル</button>
      <button class="btn btn-primary" onclick="saveClient()">保存</button>
    </div>
  </div>
</div>

<!-- 従業員モーダル -->
<div class="overlay" id="staffModal">
  <div class="modal">
    <h3 id="sModalTitle">従業員を追加</h3>
    <div class="alert" id="sAlert"></div>
    <div class="form-row"><label>部門</label>
      <select id="sDepartment">
        <option value="rental">レンタカー事業部</option>
        <option value="sales">セールス部門</option>
      </select>
    </div>
    <div class="form-row"><label>氏名</label><input type="text" id="sName" placeholder="例: 山田"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('staffModal')" style="background:#eee">キャンセル</button>
      <button class="btn btn-primary" onclick="saveStaff()">保存</button>
    </div>
  </div>
</div>

<script>
const API = '';
let vehicles = [], clients = [], staffList = [];
let editVid = null, editCid = null, editSid = null;

// ── 部門（事業部） ──
const DEPT_LABELS = { rental: 'レンタカー事業部', sales: 'セールス部門' };
const DEPT_DEFAULT = 'rental';
function initialDept() {
  const q = new URLSearchParams(location.search).get('dept');
  if (q && DEPT_LABELS[q]) return q;
  const saved = localStorage.getItem('fleetDept');
  return (saved && DEPT_LABELS[saved]) ? saved : DEPT_DEFAULT;
}
let currentDept = initialDept();

function applyDeptChrome() {
  document.body.classList.toggle('dept-sales', currentDept === 'sales');
  Object.keys(DEPT_LABELS).forEach(d => {
    const t = document.getElementById('deptTab-' + d);
    if (t) t.classList.toggle('active', d === currentDept);
  });
  document.getElementById('deptLabel').textContent = DEPT_LABELS[currentDept];
  document.getElementById('backLink').href = '/?dept=' + currentDept;
}

function switchDept(dept) {
  if (!DEPT_LABELS[dept] || dept === currentDept) return;
  currentDept = dept;
  localStorage.setItem('fleetDept', dept);
  applyDeptChrome();
  load();
}

// ── マスタ編集ロック ──
// 閲覧は誰でもできるが、追加・変更・削除は合言葉を入れた人だけに開放する。
// 画面側のボタン制御は目印にすぎず、実際の判定はサーバ側で行っている。
let masterUnlocked = false;

async function refreshLockState() {
  try {
    const j = await fetch(API + '/api/master/lock-state').then(r => r.json());
    masterUnlocked = !!j.unlocked;
  } catch (e) { masterUnlocked = false; }
  applyLockState();
}

function applyLockState() {
  const bar  = document.getElementById('lockBar');
  const text = document.getElementById('lockText');
  const btn  = document.getElementById('lockBtn');
  bar.classList.toggle('unlocked', masterUnlocked);
  text.textContent = masterUnlocked
    ? '🔓 編集できます（作業が終わったらロックしてください）'
    : '🔒 閲覧のみ（編集するには合言葉が必要です）';
  btn.textContent = masterUnlocked ? 'ロックする' : '編集する';
  document.querySelectorAll('.btn-edit, .btn-danger, .btn-success')
    .forEach(b => { b.disabled = !masterUnlocked; });
}

async function toggleLock() {
  if (masterUnlocked) {
    await fetch(API + '/api/master/lock', { method: 'POST' });
    masterUnlocked = false;
    applyLockState();
    return;
  }
  const pw = prompt('マスタ編集の合言葉を入力してください');
  if (!pw) return;
  const res = await fetch(API + '/api/master/unlock', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  if (!res.ok) { alert('合言葉が違います'); return; }
  masterUnlocked = true;
  applyLockState();
}

// 保存・削除の応答がロック切れだったときに気づけるようにする
function checkLocked(data, res) {
  if (res && res.status === 403) {
    alert('マスタ編集がロックされています。上部の「編集する」から合言葉を入れてください。');
    refreshLockState();
    return true;
  }
  return false;
}

async function load() {
  applyDeptChrome();
  [vehicles, clients, staffList] = await Promise.all([
    fetch(`${API}/api/master/vehicles?dept=${currentDept}`).then(r => r.json()),
    fetch(API + '/api/master/clients').then(r => r.json()),
    fetch(`${API}/api/master/staff?dept=${currentDept}`).then(r => r.json()),
  ]);
  renderVehicles(); renderClients(); renderStaff();
  applyLockState();
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['vehicles','clients','staff'][i] === name));
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

// ── 車両 ──
function renderVehicles() {
  const q = document.getElementById('vSearch').value.toLowerCase();
  const filtered = vehicles.filter(v => !q || v.number.includes(q) || (v.car_type||'').toLowerCase().includes(q));
  document.getElementById('vCount').textContent = `${filtered.length} 件（${DEPT_LABELS[currentDept]}）`;
  if (filtered.length === 0) {
    document.getElementById('vTable').innerHTML =
      `<tr><td colspan="7" style="text-align:center;color:#999;padding:24px">
         ${DEPT_LABELS[currentDept]}の車両はまだ登録されていません
       </td></tr>`;
    return;
  }
  document.getElementById('vTable').innerHTML = filtered.map(v => `
    <tr>
      <td><b>${v.number}</b></td>
      <td>${v.car_type||''}</td>
      <td>${v.region||''}</td>
      <td>${v.car_category||''}</td>
      <td>${v.studless ? '<span class="badge badge-ok">あり</span>' : ''}</td>
      <td>${v.is_rental_other ? '<span class="badge badge-ng">他社借り</span>' : ''}</td>
      <td class="col-ops"><div class="ops">
        <button class="btn btn-edit" onclick="openVehicleModal(${v.id})">編集</button>
        <button class="btn btn-danger" onclick="deleteVehicle(${v.id},'${v.number}')">削除</button>
      </div></td>
    </tr>`).join('');
}

function openVehicleModal(id) {
  editVid = id || null;
  const v = id ? vehicles.find(x => x.id === id) : {};
  document.getElementById('vModalTitle').textContent = id ? '車両を編集' : '車両を追加';
  document.getElementById('vDepartment').value = v.department || currentDept;
  document.getElementById('vNumber').value = v.number || '';
  document.getElementById('vCarType').value = v.car_type || '';
  document.getElementById('vRegion').value = v.region || '';
  document.getElementById('vCarCategory').value = v.car_category || '';
  document.getElementById('vStudless').checked = !!v.studless;
  document.getElementById('vRentalOther').checked = !!v.is_rental_other;
  document.getElementById('vAlert').className = 'alert';
  document.getElementById('vehicleModal').classList.add('open');
}

async function saveVehicle() {
  const body = {
    number: document.getElementById('vNumber').value.trim(),
    car_type: document.getElementById('vCarType').value.trim(),
    region: document.getElementById('vRegion').value.trim(),
    car_category: document.getElementById('vCarCategory').value.trim(),
    studless: document.getElementById('vStudless').checked,
    is_rental_other: document.getElementById('vRentalOther').checked,
  };
  if (!body.number) { showAlert('vAlert', '車番を入力してください'); return; }
  body.department = document.getElementById('vDepartment').value;
  const url = editVid ? `${API}/api/master/vehicles/${editVid}` : `${API}/api/master/vehicles`;
  const method = editVid ? 'PUT' : 'POST';
  const res = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await res.json();
  if (checkLocked(data, res)) { closeModal('vehicleModal'); return; }
  if (data.error) { showAlert('vAlert', data.error); return; }
  closeModal('vehicleModal');
  await load();
}

async function deleteVehicle(id, num) {
  if (!confirm(`車番 ${num} を削除しますか？関連するすべての状態履歴も削除されます。`)) return;
  const dres = await fetch(`${API}/api/master/vehicles/${id}`, {method:'DELETE'});
  if (checkLocked(null, dres)) return;
  await load();
}

// ── 取引先 ──
function renderClients() {
  const q = document.getElementById('cSearch').value.toLowerCase();
  const filtered = clients.filter(c => !q ||
    c.name.toLowerCase().includes(q) || (c.reading||'').toLowerCase().includes(q));
  document.getElementById('cCount').textContent = filtered.length + ' 件';
  document.getElementById('cTable').innerHTML = filtered.map(c => `
    <tr>
      <td>${c.name}</td>
      <td style="color:#888">${c.reading||''}</td>
      <td class="col-ops"><div class="ops">
        <button class="btn btn-edit" onclick="openClientModal(${c.id})">編集</button>
        <button class="btn btn-danger" onclick="deleteClient(${c.id},'${c.name.replace(/'/g,"\\'")}')">削除</button>
      </div></td>
    </tr>`).join('');
}

function openClientModal(id) {
  editCid = id || null;
  const c = id ? clients.find(x => x.id === id) : {};
  document.getElementById('cModalTitle').textContent = id ? '取引先を編集' : '取引先を追加';
  document.getElementById('cName').value = c.name || '';
  document.getElementById('cReading').value = c.reading || '';
  document.getElementById('cAlert').className = 'alert';
  document.getElementById('clientModal').classList.add('open');
}

async function saveClient() {
  const body = {
    name: document.getElementById('cName').value.trim(),
    reading: document.getElementById('cReading').value.trim(),
  };
  if (!body.name) { showAlert('cAlert', '取引先名を入力してください'); return; }
  const url = editCid ? `${API}/api/master/clients/${editCid}` : `${API}/api/master/clients`;
  const method = editCid ? 'PUT' : 'POST';
  const res = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await res.json();
  if (data.error) { showAlert('cAlert', data.error); return; }
  closeModal('clientModal');
  await load();
}

async function deleteClient(id, name) {
  if (!confirm(`「${name}」を削除しますか？`)) return;
  const dres = await fetch(`${API}/api/master/clients/${id}`, {method:'DELETE'});
  if (checkLocked(null, dres)) return;
  await load();
}

// ── 従業員 ──
function renderStaff() {
  document.getElementById('sCount').textContent = `${staffList.length} 件（${DEPT_LABELS[currentDept]}）`;
  if (staffList.length === 0) {
    document.getElementById('sTable').innerHTML =
      `<tr><td colspan="2" style="text-align:center;color:#999;padding:24px">
         ${DEPT_LABELS[currentDept]}の従業員はまだ登録されていません
       </td></tr>`;
    return;
  }
  document.getElementById('sTable').innerHTML = staffList.map(s => `
    <tr>
      <td><b>${s.name}</b></td>
      <td class="col-ops"><div class="ops">
        <button class="btn btn-edit" onclick="openStaffModal(${s.id})">編集</button>
        <button class="btn btn-danger" onclick="deleteStaff(${s.id},'${s.name}')">削除</button>
      </div></td>
    </tr>`).join('');
}

function openStaffModal(id) {
  editSid = id || null;
  const s = id ? staffList.find(x => x.id === id) : {};
  document.getElementById('sModalTitle').textContent = id ? '従業員を編集' : '従業員を追加';
  document.getElementById('sDepartment').value = s.department || currentDept;
  document.getElementById('sName').value = s.name || '';
  document.getElementById('sAlert').className = 'alert';
  document.getElementById('staffModal').classList.add('open');
}

async function saveStaff() {
  const body = {
    name: document.getElementById('sName').value.trim(),
    department: document.getElementById('sDepartment').value,
  };
  if (!body.name) { showAlert('sAlert', '氏名を入力してください'); return; }
  const url = editSid ? `${API}/api/master/staff/${editSid}` : `${API}/api/master/staff`;
  const method = editSid ? 'PUT' : 'POST';
  const res = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const data = await res.json();
  if (data.error) { showAlert('sAlert', data.error); return; }
  closeModal('staffModal');
  await load();
}

async function deleteStaff(id, name) {
  if (!confirm(`「${name}」を削除しますか？`)) return;
  const dres = await fetch(`${API}/api/master/staff/${id}`, {method:'DELETE'});
  if (checkLocked(null, dres)) return;
  await load();
}

// ── 共通 ──
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function showAlert(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'alert error';
}
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if(e.target===o) o.classList.remove('open'); }));

refreshLockState();
load();
</script>
</body>
</html>
