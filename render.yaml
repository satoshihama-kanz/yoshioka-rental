services:
  - type: web
    name: yoshioka-rental
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: fleet-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
